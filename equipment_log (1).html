<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Equipment Log System</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #0a0e1a;
    --panel: #0f1628;
    --border: #1e3a5f;
    --accent: #00d4ff;
    --accent2: #ff6b35;
    --green: #00ff88;
    --text: #c8d8e8;
    --muted: #4a6080;
    --danger: #ff3355;
    --card: #111827;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Exo 2', sans-serif;
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(0,100,200,0.07) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(0,212,255,0.05) 0%, transparent 50%),
      repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(0,212,255,0.015) 40px, rgba(0,212,255,0.015) 41px),
      repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(0,212,255,0.015) 40px, rgba(0,212,255,0.015) 41px);
  }

  header {
    border-bottom: 1px solid var(--border);
    padding: 18px 40px;
    display: flex;
    align-items: center;
    gap: 16px;
    background: rgba(15,22,40,0.9);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo-icon {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, var(--accent), #0066ff);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    box-shadow: 0 0 20px rgba(0,212,255,0.3);
  }

  header h1 { font-size: 1.2rem; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: #fff; }
  header span { font-family: 'Share Tech Mono', monospace; font-size: 0.7rem; color: var(--muted); letter-spacing: 2px; }

  .status-pill {
    margin-left: auto;
    display: flex; align-items: center; gap: 8px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.7rem; color: var(--green); letter-spacing: 1px;
  }

  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--green); box-shadow: 0 0 8px var(--green);
    animation: pulse 2s infinite;
  }

  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.8)} }
  @keyframes fadeIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
  @keyframes slideIn { from{opacity:0;transform:translateX(-20px)} to{opacity:1;transform:translateX(0)} }

  main { max-width: 900px; margin: 0 auto; padding: 40px 24px; }

  #login-screen {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 70vh; gap: 32px;
    animation: fadeIn .5s ease;
  }

  .login-card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; padding: 48px; width: 100%; max-width: 440px;
    position: relative; overflow: hidden;
  }

  .login-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--accent), #0066ff, var(--accent));
    background-size: 200% 100%; animation: shimmer 3s linear infinite;
  }

  @keyframes shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }

  .login-card h2 { font-size: 1rem; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
  .login-card p { color: var(--muted); font-size: .85rem; margin-bottom: 36px; font-family: 'Share Tech Mono', monospace; }

  .field-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }

  label { font-size: .7rem; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); font-family: 'Share Tech Mono', monospace; }

  input, select, textarea {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 12px 16px; border-radius: 8px; font-family: 'Share Tech Mono', monospace;
    font-size: .9rem; outline: none; transition: border-color .2s, box-shadow .2s; width: 100%;
  }

  input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,212,255,.1); }
  select option { background: var(--card); }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 13px 28px; border: none; border-radius: 8px;
    font-family: 'Exo 2', sans-serif; font-weight: 600; font-size: .85rem;
    letter-spacing: 2px; text-transform: uppercase; cursor: pointer; transition: all .2s;
  }

  .btn-primary { background: linear-gradient(135deg, var(--accent), #0066ff); color: #fff; width: 100%; justify-content: center; box-shadow: 0 4px 20px rgba(0,212,255,.25); }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 28px rgba(0,212,255,.35); }
  .btn-success { background: linear-gradient(135deg, var(--green), #00aa55); color: #000; }
  .btn-success:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,255,136,.3); }
  .btn-danger { background: rgba(255,51,85,.15); color: var(--danger); border: 1px solid rgba(255,51,85,.3); }
  .btn-danger:hover { background: rgba(255,51,85,.25); }
  .btn-outline { background: transparent; color: var(--accent); border: 1px solid var(--border); }
  .btn-outline:hover { border-color: var(--accent); background: rgba(0,212,255,.05); }

  #dashboard { display: none; animation: fadeIn .5s ease; }

  .emp-banner {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 24px 28px; display: flex; align-items: center; gap: 20px;
    margin-bottom: 32px; position: relative; overflow: hidden;
  }

  .emp-banner::after {
    content: ''; position: absolute; right: -20px; top: -20px;
    width: 120px; height: 120px; border-radius: 50%;
    background: radial-gradient(circle, rgba(0,212,255,.08), transparent 70%);
  }

  .emp-avatar {
    width: 56px; height: 56px; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), #0066ff);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem; font-weight: 700; color: #fff; flex-shrink: 0;
  }

  .emp-info h2 { font-size: 1.1rem; font-weight: 700; color: #fff; }
  .emp-info p { font-family: 'Share Tech Mono', monospace; font-size: .75rem; color: var(--accent); letter-spacing: 2px; }
  .emp-actions { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; }

  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }

  .section-title {
    font-size: .75rem; font-weight: 600; letter-spacing: 4px; text-transform: uppercase;
    color: var(--muted); font-family: 'Share Tech Mono', monospace;
    display: flex; align-items: center; gap: 10px;
  }
  .section-title::before { content: ''; width: 16px; height: 2px; background: var(--accent); }

  #add-form {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 28px; margin-bottom: 28px; display: none; animation: slideIn .3s ease;
  }
  #add-form.open { display: block; }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-grid .span-2 { grid-column: span 2; }

  .charge-track { display: flex; align-items: center; gap: 12px; }
  .charge-track input[type=range] {
    flex: 1; padding: 0; height: 6px; border-radius: 4px;
    -webkit-appearance: none; background: var(--border); cursor: pointer;
  }
  .charge-track input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent); cursor: pointer; box-shadow: 0 0 8px rgba(0,212,255,.5);
  }
  .charge-display { font-family: 'Share Tech Mono', monospace; font-size: 1.1rem; font-weight: bold; width: 52px; text-align: right; flex-shrink: 0; }

  .form-actions { display: flex; gap: 12px; margin-top: 20px; justify-content: flex-end; }

  .entries-container { display: flex; flex-direction: column; gap: 12px; }

  .entry-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 20px 24px; display: grid; grid-template-columns: auto 1fr auto;
    align-items: center; gap: 20px; transition: border-color .2s; animation: slideIn .3s ease;
  }
  .entry-card:hover { border-color: rgba(0,212,255,.3); }

  .entry-num { font-family: 'Share Tech Mono', monospace; font-size: 1.4rem; font-weight: bold; color: var(--border); width: 36px; text-align: center; }
  .entry-main h3 { font-size: 1rem; font-weight: 600; color: #fff; margin-bottom: 6px; }
  .entry-meta { display: flex; flex-wrap: wrap; gap: 14px; }

  .meta-chip { display: flex; align-items: center; gap: 6px; font-family: 'Share Tech Mono', monospace; font-size: .72rem; color: var(--muted); }
  .meta-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  .meta-chip.hi { color: var(--text); }

  .charge-badge { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .charge-ring {
    width: 56px; height: 56px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Share Tech Mono', monospace; font-weight: bold; font-size: .85rem;
  }

  .icon-btn {
    width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--border);
    background: transparent; color: var(--muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 14px; transition: all .2s;
  }
  .icon-btn:hover { border-color: var(--danger); color: var(--danger); background: rgba(255,51,85,.05); }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-state .icon { font-size: 3rem; margin-bottom: 16px; opacity: .4; }
  .empty-state p { font-family: 'Share Tech Mono', monospace; font-size: .8rem; letter-spacing: 2px; }

  .err { color: var(--danger); font-size: .72rem; font-family: 'Share Tech Mono', monospace; margin-top: 4px; display: none; }
  textarea { resize: vertical; min-height: 70px; }

  @media(max-width:600px){
    .form-grid{grid-template-columns:1fr}
    .form-grid .span-2{grid-column:span 1}
    .entry-card{grid-template-columns:1fr}
    .entry-num{display:none}
    header{padding:14px 20px}
    .login-card{padding:32px 24px}
    .emp-banner{flex-wrap:wrap}
    .emp-actions{width:100%}
  }
</style>
</head>
<body>

<header>
  <div class="logo-icon">⚡</div>
  <div>
    <h1>EquipLog</h1>
    <span>EQUIPMENT MANAGEMENT SYSTEM</span>
  </div>
  <div class="status-pill"><div class="status-dot"></div>SYSTEM ONLINE</div>
</header>

<main>

  <!-- LOGIN -->
  <div id="login-screen">
    <div class="login-card">
      <h2>Access Portal</h2>
      <p>// ENTER CREDENTIALS TO CONTINUE</p>
      <div class="field-group">
        <label>Employee ID</label>
        <input type="text" id="emp-id-input" placeholder="e.g. EMP-1042" maxlength="20" autocomplete="off">
        <span class="err" id="id-err">⚠ Employee ID is required</span>
      </div>
      <div class="field-group">
        <label>Employee Name</label>
        <input type="text" id="emp-name-input" placeholder="Full name" maxlength="60">
        <span class="err" id="name-err">⚠ Name is required</span>
      </div>
      <button class="btn btn-primary" onclick="login()">⟶ &nbsp;Proceed to Dashboard</button>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard">

    <div class="emp-banner">
      <div class="emp-avatar" id="emp-avatar"></div>
      <div class="emp-info">
        <h2 id="emp-name-display"></h2>
        <p id="emp-id-display"></p>
      </div>
      <div class="emp-actions">
        <button class="btn btn-outline" onclick="toggleForm()">＋ Add Equipment</button>
        <button class="btn btn-success" onclick="exportToExcel()" style="font-size:.75rem;padding:10px 18px;">⬇ Export Excel</button>
        <button class="btn btn-danger" onclick="logout()">✕ Sign Out</button>
      </div>
    </div>

    <!-- ADD FORM -->
    <div id="add-form">
      <div class="section-title" style="margin-bottom:20px">New Equipment Entry</div>
      <div class="form-grid">

        <div class="field-group">
          <label>Equipment Name / ID</label>
          <input type="text" id="f-name" placeholder="e.g. Transformer T-3, Relay R-01">
        </div>

        <div class="field-group">
          <label>Equipment Type</label>
          <select id="f-type">
            <option value="">— Select Type —</option>
            <option>Transformer</option>
            <option>Circuit Breaker</option>
            <option>Relay</option>
            <option>Switchgear</option>
            <option>Generator</option>
            <option>Motor</option>
            <option>Panel</option>
            <option>Cable</option>
            <option>Meter</option>
            <option>Other</option>
          </select>
        </div>

        <div class="field-group">
          <label>Trip Date &amp; Time</label>
          <input type="datetime-local" id="f-trip">
        </div>

        <div class="field-group">
          <label>Closing Date &amp; Time</label>
          <input type="datetime-local" id="f-close">
        </div>

        <div class="field-group">
          <label>Clearance Given By</label>
          <input type="text" id="f-clearance" placeholder="Officer / Authority name">
        </div>

        <div class="field-group">
          <label>Charge Percentage</label>
          <div class="charge-track">
            <input type="range" id="f-charge" min="0" max="100" value="50" oninput="updateCharge(this.value)">
            <span class="charge-display" id="charge-val">50%</span>
          </div>
        </div>

        <div class="field-group span-2">
          <label>Remarks / Notes</label>
          <textarea id="f-remarks" placeholder="Any additional details..."></textarea>
        </div>

      </div>
      <div class="form-actions">
        <button class="btn btn-outline" onclick="toggleForm()">Cancel</button>
        <button class="btn btn-success" onclick="saveEntry()">✓ Save Entry</button>
      </div>
    </div>

    <!-- LIST -->
    <div class="section-header">
      <div class="section-title">Equipment Log Entries</div>
      <div id="entry-count" style="font-family:'Share Tech Mono',monospace;font-size:.75rem;color:var(--muted)"></div>
    </div>
    <div class="entries-container" id="entries-list">
      <div class="empty-state">
        <div class="icon">📋</div>
        <p>NO ENTRIES YET — ADD EQUIPMENT ABOVE</p>
      </div>
    </div>

  </div>
</main>

<script>
  let emp = null, entries = [];

  function login() {
    const id = document.getElementById('emp-id-input').value.trim();
    const name = document.getElementById('emp-name-input').value.trim();
    document.getElementById('id-err').style.display = id ? 'none' : 'block';
    document.getElementById('name-err').style.display = name ? 'none' : 'block';
    if (!id || !name) return;

    emp = { id, name };
    const saved = localStorage.getItem('equiplog_' + id);
    entries = saved ? JSON.parse(saved) : [];

    document.getElementById('emp-name-display').textContent = name;
    document.getElementById('emp-id-display').textContent = 'EMPLOYEE ID: ' + id;
    document.getElementById('emp-avatar').textContent = name[0].toUpperCase();

    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    renderEntries();
  }

  function logout() {
    emp = null; entries = [];
    document.getElementById('emp-id-input').value = '';
    document.getElementById('emp-name-input').value = '';
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('add-form').classList.remove('open');
  }

  function toggleForm() {
    const f = document.getElementById('add-form');
    f.classList.toggle('open');
    if (f.classList.contains('open')) clearForm();
  }

  function clearForm() {
    ['f-name','f-type','f-trip','f-close','f-clearance','f-remarks'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('f-charge').value = 50;
    document.getElementById('charge-val').textContent = '50%';
    document.getElementById('charge-val').style.color = '';
  }

  function updateCharge(v) {
    const el = document.getElementById('charge-val');
    el.textContent = v + '%';
    el.style.color = v < 30 ? 'var(--danger)' : v < 60 ? 'var(--accent2)' : 'var(--green)';
  }

  function saveEntry() {
    const name = document.getElementById('f-name').value.trim();
    const type = document.getElementById('f-type').value;
    const trip = document.getElementById('f-trip').value;
    const close = document.getElementById('f-close').value;
    const clearance = document.getElementById('f-clearance').value.trim();
    const charge = parseInt(document.getElementById('f-charge').value);
    const remarks = document.getElementById('f-remarks').value.trim();

    if (!name || !type || !trip || !clearance) {
      alert('Please fill in: Equipment Name, Type, Trip Date/Time, and Clearance Given By.');
      return;
    }

    entries.unshift({ id: Date.now(), name, type, trip, close, clearance, charge, remarks });
    localStorage.setItem('equiplog_' + emp.id, JSON.stringify(entries));
    renderEntries();
    toggleForm();
  }

  function deleteEntry(id) {
    if (!confirm('Delete this entry?')) return;
    entries = entries.filter(e => e.id !== id);
    localStorage.setItem('equiplog_' + emp.id, JSON.stringify(entries));
    renderEntries();
  }

  function renderEntries() {
    const list = document.getElementById('entries-list');
    document.getElementById('entry-count').textContent = entries.length + ' RECORD' + (entries.length !== 1 ? 'S' : '');

    if (!entries.length) {
      list.innerHTML = '<div class="empty-state"><div class="icon">📋</div><p>NO ENTRIES YET — ADD EQUIPMENT ABOVE</p></div>';
      return;
    }

    list.innerHTML = entries.map((e, i) => {
      const cc = e.charge < 30 ? '#ff3355' : e.charge < 60 ? '#ff6b35' : '#00ff88';
      return `<div class="entry-card">
        <div class="entry-num">${String(entries.length - i).padStart(2,'0')}</div>
        <div class="entry-main">
          <h3>${esc(e.name)} <span style="color:var(--muted);font-weight:400;font-size:.8rem;margin-left:8px;">[${esc(e.type)}]</span></h3>
          <div class="entry-meta">
            <div class="meta-chip hi"><span class="dot" style="background:#ff3355"></span>TRIP: ${fmtDT(e.trip)}</div>
            <div class="meta-chip hi"><span class="dot" style="background:var(--green)"></span>CLOSE: ${fmtDT(e.close)}</div>
            <div class="meta-chip"><span class="dot" style="background:var(--accent)"></span>CLEARANCE: ${esc(e.clearance)}</div>
            ${e.remarks ? `<div class="meta-chip"><span class="dot"></span>${esc(e.remarks)}</div>` : ''}
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:14px">
          <div class="charge-badge">
            <div class="charge-ring" style="background:conic-gradient(${cc} ${e.charge*3.6}deg,rgba(255,255,255,.05) 0deg);color:${cc}">${e.charge}%</div>
            <span style="font-family:'Share Tech Mono',monospace;font-size:.6rem;color:var(--muted);letter-spacing:1px">CHARGE</span>
          </div>
          <button class="icon-btn" onclick="deleteEntry(${e.id})" title="Delete">🗑</button>
        </div>
      </div>`;
    }).join('');
  }

  function fmtDT(dt) {
    if (!dt) return '—';
    const d = new Date(dt);
    return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}) + ' ' +
           d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true});
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function exportToExcel() {
    if (!entries.length) {
      alert('No entries to export yet. Add some equipment records first.');
      return;
    }

    // Build rows
    const rows = entries.map((e, i) => ({
      'S.No': entries.length - i,
      'Equipment Name': e.name,
      'Equipment Type': e.type,
      'Trip Date & Time': e.trip ? fmtDT(e.trip) : '',
      'Closing Date & Time': e.close ? fmtDT(e.close) : '',
      'Clearance Given By': e.clearance,
      'Charge (%)': e.charge,
      'Remarks': e.remarks || ''
    }));

    const ws = XLSX.utils.json_to_sheet(rows);

    // Column widths
    ws['!cols'] = [
      { wch: 6 }, { wch: 24 }, { wch: 18 }, { wch: 22 },
      { wch: 22 }, { wch: 24 }, { wch: 12 }, { wch: 30 }
    ];

    // Header style (bold, blue bg, white text)
    const headerRange = XLSX.utils.decode_range(ws['!ref']);
    for (let C = headerRange.s.c; C <= headerRange.e.c; C++) {
      const cell = ws[XLSX.utils.encode_cell({ r: 0, c: C })];
      if (cell) {
        cell.s = {
          font: { bold: true, color: { rgb: 'FFFFFF' } },
          fill: { fgColor: { rgb: '0066CC' } },
          alignment: { horizontal: 'center', vertical: 'center' },
          border: {
            bottom: { style: 'thin', color: { rgb: 'AAAAAA' } },
            right: { style: 'thin', color: { rgb: 'AAAAAA' } }
          }
        };
      }
    }

    // Alternating row colors + center charge column
    for (let R = 1; R <= rows.length; R++) {
      const fillColor = R % 2 === 0 ? 'EBF3FB' : 'FFFFFF';
      for (let C = headerRange.s.c; C <= headerRange.e.c; C++) {
        const cellRef = XLSX.utils.encode_cell({ r: R, c: C });
        if (ws[cellRef]) {
          ws[cellRef].s = {
            fill: { fgColor: { rgb: fillColor } },
            alignment: { horizontal: C === 6 ? 'center' : 'left', vertical: 'center' },
            border: { bottom: { style: 'thin', color: { rgb: 'DDDDDD' } }, right: { style: 'thin', color: { rgb: 'DDDDDD' } } }
          };
        }
      }
    }

    // Info sheet
    const infoData = [
      ['EQUIPMENT LOG REPORT'],
      [''],
      ['Employee Name', emp.name],
      ['Employee ID', emp.id],
      ['Exported On', new Date().toLocaleString('en-IN')],
      ['Total Records', entries.length],
    ];
    const wsInfo = XLSX.utils.aoa_to_sheet(infoData);
    wsInfo['!cols'] = [{ wch: 20 }, { wch: 30 }];
    wsInfo['A1'].s = { font: { bold: true, sz: 14, color: { rgb: '0066CC' } } };

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, wsInfo, 'Report Info');
    XLSX.utils.book_append_sheet(wb, ws, 'Equipment Log');

    const fileName = `EquipLog_${emp.id}_${new Date().toISOString().slice(0,10)}.xlsx`;
    XLSX.writeFile(wb, fileName);
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && document.getElementById('login-screen').style.display !== 'none') login();
  });
</script>
</body>
</html>
